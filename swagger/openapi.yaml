  "components" : {
    "schemas" : {
      "AvailableIntegration" : {
        "required" : [ "category", "confidence", "description", "id", "name", "publisher", "updatedAt", "version" ],
        "type" : "object",
        "properties" : {
          "publisher" : {
            "type" : "string",
            "description" : "The user-facing name of the company or individual that owns/publishes this integration."
          },
          "updatedAt" : {
            "type" : "string",
            "description" : "The last time the integration was published/updated",
            "format" : "date-time"
          },
          "version" : {
            "type" : "string",
            "description" : "The integration's current version."
          },
          "description" : {
            "type" : "string",
            "description" : "The publisher's summary of the integration's use, functionality, and behaviors."
          },
          "confidence" : {
            "type" : "string",
            "description" : "An approximate representation of how strongly this integration is coorelated to the device",
            "enum" : [ "high", "medium", "low" ]
          },
          "category" : {
            "type" : "string",
            "description" : "The integration category underwhich the integration falls.",
            "enum" : [ "display", "camera" ]
          },
          "name" : {
            "type" : "string",
            "description" : "A user-friendly name, shown to end users."
          },
          "id" : {
            "type" : "string",
            "description" : "the unique identifier for the integration."
          }
        }
      },
      "HealthResponse" : {
        "required" : [ "message" ],
        "type" : "object",
        "properties" : {
          "message" : {
            "type" : "string",
            "description" : "Typically, just \"okay\""
          }
        }
      },
      "ErrorResponse" : {
        "required" : [ "message" ],
        "type" : "object",
        "properties" : {
          "message" : {
            "type" : "string"
          },
          "details" : {
            "type" : "object"
          }
        }
      },
      "OauthTokenTypeIdentifier" : {
        "type" : "string",
        "description" : "Token type identifier URI (RFC 8693 3).",
        "enum" : [ "urn:ietf:params:oauth:token-type:access_token", "urn:ietf:params:oauth:token-type:refresh_token", "urn:ietf:params:oauth:token-type:id_token", "urn:ietf:params:oauth:token-type:saml1", "urn:ietf:params:oauth:token-type:saml2", "urn:ietf:params:oauth:token-type:jwt" ]
      },
      "OauthTokenResponse" : {
        "required" : [ "access_token", "token_type" ],
        "type" : "object",
        "properties" : {
          "access_token" : {
            "type" : "string",
            "description" : "The issued access token. Opaque to the client (RFC 6749 1.4).",
            "example" : "2YotnFZFEjr1zCsicMWpAA"
          },
          "token_type" : {
            "type" : "string",
            "description" : "How the client must present the token. Case-insensitive per RFC 6749 7.1;\n`Bearer` (RFC 6750).\n",
            "example" : "Bearer",
            "enum" : [ "Bearer" ]
          },
          "expires_in" : {
            "minimum" : 1,
            "type" : "integer",
            "description" : "Access token lifetime in seconds from the time of the response. RECOMMENDED;\nwhen omitted, the lifetime is established by other means.\n",
            "format" : "int64",
            "example" : 3600
          },
          "refresh_token" : {
            "type" : "string",
            "description" : "Issued when the client is allowed to refresh and the `offline_access` scope (or\nequivalent policy) applies. MUST NOT be issued for the client credentials grant.\n",
            "example" : "tGzv3JOkF0XG5Qx2TlKWIA"
          },
          "scope" : {
            "type" : "string",
            "description" : "REQUIRED if the granted scope differs from the requested scope; otherwise\nOPTIONAL. Space-delimited.\n",
            "example" : "openid profile"
          },
          "issued_token_type" : {
            "$ref" : "#/components/schemas/OauthTokenTypeIdentifier"
          }
        },
        "additionalProperties" : true,
        "description" : "Successful token response (RFC 6749 5.1, OIDC Core 3.1.3.3). Additional parameters\nbeyond those defined here MAY be present and MUST be ignored if unrecognized.\n"
      },
      "OauthTokenRequest" : {
        "type" : "object",
        "description" : "Form-encoded token request. `grant_type` selects which additional parameters are\nrequired; each `oneOf` variant below constrains one grant type. Unrecognized\nparameters are ignored by the server.\n",
        "discriminator" : {
          "propertyName" : "grant_type",
          "mapping" : {
            "https://api.interop.snapone.com/oauth/grant/ovrc-session" : "#/components/schemas/OauthOvrcSessionGrantRequest"
          }
        },
        "oneOf" : [ {
          "$ref" : "#/components/schemas/OauthOvrcSessionGrantRequest"
        } ]
      },
      "OauthCommonGrantParameters" : {
        "type" : "object",
        "properties" : {
          "scope" : {
            "pattern" : "^[\\x21\\x23-\\x5B\\x5D-\\x7E]+( [\\x21\\x23-\\x5B\\x5D-\\x7E]+)*$",
            "type" : "string",
            "description" : "Space-delimited, case-sensitive scope values (RFC 6749 3.3). Include `openid`\nto request an ID token. For `refresh_token`, the requested scope MUST NOT\nexceed the scope originally granted.\n",
            "example" : "openid profile offline_access"
          },
          "resource" : {
            "type" : "array",
            "description" : "Target service(s) the access token is requested for (RFC 8707). Each value MUST\nbe an absolute URI without a fragment. Repeat the parameter for multiple values.\n",
            "example" : [ "https://api.interop.snapone.com/v1" ],
            "items" : {
              "type" : "string",
              "format" : "uri"
            }
          },
          "audience" : {
            "type" : "array",
            "description" : "Logical name(s) of the target service (RFC 8693 2.1).",
            "items" : {
              "type" : "string"
            }
          }
        },
        "description" : "Parameters accepted alongside more than one grant type."
      },
      "OauthOvrcSessionGrantRequest" : {
        "description" : "A custom Oauth grant which uses an OvrC session token for the grant. Custom grant types are supported, per \"https://datatracker.ietf.org/doc/html/rfc6749#section-8.3\". This grant type requires the \"X-Session-ID\" header be provided in the request headers.\n",
        "allOf" : [ {
          "$ref" : "#/components/schemas/OauthCommonGrantParameters"
        }, {
          "required" : [ "code", "grant_type" ],
          "type" : "object",
          "properties" : {
            "grant_type" : {
              "type" : "string",
              "enum" : [ "https://api.interop.snapone.com/oauth/grant/ovrc-session" ]
            }
          }
        } ]
      },
      "OauthTokenErrorResponse" : {
        "required" : [ "error" ],
        "type" : "object",
        "properties" : {
          "error" : {
            "type" : "string",
            "description" : "A single ASCII error code.\n\nRFC 6749 5.2:\n  - `invalid_request` — missing, repeated, or otherwise malformed parameter.\n  - `invalid_client` — client authentication failed (`401` when an HTTP auth\n    scheme was used, `400` otherwise).\n  - `invalid_grant` — the grant or refresh token is invalid, expired, revoked,\n    does not match the `redirect_uri`, or was issued to another client.\n  - `unauthorized_client` — the client is not authorized to use this grant type.\n  - `unsupported_grant_type` — the grant type is not supported by the server.\n  - `invalid_scope` — the requested scope is unknown, malformed, or exceeds\n    the originally granted scope.\n\nRFC 8628 3.5 (device code polling):\n  - `authorization_pending`, `slow_down`, `access_denied`, `expired_token`.\n\nOther:\n  - `invalid_target` — the `resource` or `audience` value is invalid (RFC 8707 2).\n  - `invalid_dpop_proof`, `use_dpop_nonce` — DPoP failures (RFC 9449).\n  - `server_error`, `temporarily_unavailable` — server-side failures.\n",
            "enum" : [ "invalid_request", "invalid_client", "invalid_grant", "unauthorized_client", "unsupported_grant_type", "invalid_scope", "invalid_target", "authorization_pending", "slow_down", "access_denied", "expired_token", "invalid_dpop_proof", "use_dpop_nonce", "server_error", "temporarily_unavailable" ]
          },
          "error_description" : {
            "pattern" : "^[\\x20-\\x21\\x23-\\x5B\\x5D-\\x7E]*$",
            "type" : "string",
            "description" : "Human-readable ASCII text (no `\"` or `\\`) aiding the developer. MUST NOT be\nshown to end users and MUST NOT leak whether a credential or a subject existed.\n"
          },
          "error_uri" : {
            "type" : "string",
            "description" : "Web page with human-readable information about the error.",
            "format" : "uri"
          }
        },
        "description" : "Error response (RFC 6749 5.2, RFC 8628 3.5, RFC 6750 3.1)."
      },
      "inline_response_200" : {
        "required" : [ "data" ],
        "type" : "object",
        "properties" : {
          "data" : {
            "type" : "string",
            "format" : "byte",
            "example" : "ZEdocGN5QnBjeUJoSUdKaGMyVTJOQ0JsYm1OdlpHVmtJSE4wY21sdVp3PT0="
          }
        }
      },
      "deviceId_storage_body" : {
        "required" : [ "data" ],
        "type" : "object",
        "properties" : {
          "data" : {
            "type" : "string",
            "format" : "byte",
            "example" : "ZEdocGN5QnBjeUJoSUdKaGMyVTJOQ0JsYm1OdlpHVmtJSE4wY21sdVp3PT0="
          }
        }
      },
      "inline_response_200_1" : {
        "required" : [ "integrations" ],
        "type" : "object",
        "properties" : {
          "suggestion" : {
            "description" : "populated with an integration that is likely a better fit for the device than the currently select (default) integration. This suggestion can be dismissed by setting the default integration again, using PUT /v1/devices/{deviceId}/integrations/default\n",
            "nullable" : true,
            "allOf" : [ {
              "$ref" : "#/components/schemas/AvailableIntegration"
            } ]
          },
          "defaultIntegration" : {
            "description" : "the user-selected integration to use for this device\n",
            "nullable" : true,
            "allOf" : [ {
              "$ref" : "#/components/schemas/AvailableIntegration"
            } ]
          },
          "integrations" : {
            "type" : "array",
            "items" : {
              "$ref" : "#/components/schemas/AvailableIntegration"
            }
          }
        }
      },
      "integrations_default_body" : {
        "required" : [ "integrationId" ],
        "type" : "object",
        "properties" : {
          "integrationId" : {
            "type" : "string"
          }
        }
      },
      "graphql_query_body" : {
        "required" : [ "query" ],
        "type" : "object",
        "properties" : {
          "query" : {
            "type" : "string"
          }
        }
      }
    },
    "securitySchemes" : {
      "ApiKey" : {
        "type" : "apiKey",
        "description" : "This header is typically used in tandem with the session id scheme, and is used for api to api communication, such as from OvrC to Interop.\n",
        "name" : "X-API-Key",
        "in" : "header"
      },
      "SessionId" : {
        "type" : "apiKey",
        "description" : "The session id scheme is typically used in tandem with the api key scheme. It is typically used for requests sent from OvrC to the Interop API. The session id should be the OvrC user's session id.\n",
        "name" : "X-Session-ID",
        "in" : "header"
      },
      "BearerJWT" : {
        "type" : "http",
        "description" : "This scheme is used for scenarios where an interop JWT is used for authentication, such as for endpoints invoked by external integrations.\n",
        "scheme" : "bearer",
        "bearerFormat" : "JWT"
      }
