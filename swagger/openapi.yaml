  "paths" : {
    "/v1/oauth/token" : {
      "post" : {
        "tags" : [ "OAuth" ],
        "summary" : "Obtain or refresh an access token",
        "operationId" : "postOAuthToken",
        "requestBody" : {
          "content" : {
            "application/x-www-form-urlencoded" : {
              "schema" : {
                "$ref" : "#/components/schemas/OauthTokenRequest"
              },
              "encoding" : {
                "scope" : {
                  "style" : "form",
                  "explode" : false
                }
              }
            }
          },
          "required" : true
        },
        "responses" : {
          "200" : {
            "description" : "Token issued. Per RFC 6749 5.1 the response is JSON with `no-store` caching.\n",
            "content" : {
              "application/json" : {
                "schema" : {
                  "$ref" : "#/components/schemas/OauthTokenResponse"
                }
              }
            }
          },
          "400" : {
            "description" : "Invalid request per RFC 6749 5.2. Used for every error except failed client\nauthentication, which is `401` when an HTTP authentication scheme was used.\n",
            "headers" : {
              "Cache-Control" : {
                "required" : true,
                "style" : "simple",
                "explode" : false,
                "schema" : {
                  "type" : "string",
                  "enum" : [ "no-store" ]
                }
              }
            },
            "content" : {
              "application/json" : {
                "schema" : {
                  "$ref" : "#/components/schemas/OauthTokenErrorResponse"
                },
                "examples" : {
                  "invalidGrant" : {
                    "value" : {
                      "error" : "invalid_grant",
                      "error_description" : "The authorization code has expired."
                    }
                  },
                  "unsupportedGrantType" : {
                    "value" : {
                      "error" : "unsupported_grant_type"
                    }
                  }
                }
              }
            }
          },
          "401" : {
            "description" : "Client authentication failed (RFC 6749 5.2). The server responds with\n`error: invalid_client` and, if the client used the `Authorization` header,\na `WWW-Authenticate` challenge.\n",
            "headers" : {
              "WWW-Authenticate" : {
                "style" : "simple",
                "explode" : false,
                "schema" : {
                  "type" : "string",
                  "example" : "Basic realm=\"oauth\""
                }
              },
              "Cache-Control" : {
                "required" : true,
                "style" : "simple",
                "explode" : false,
                "schema" : {
                  "type" : "string",
                  "enum" : [ "no-store" ]
                }
              }
            },
            "content" : {
              "application/json" : {
                "schema" : {
                  "$ref" : "#/components/schemas/OauthTokenErrorResponse"
                },
                "example" : {
                  "error" : "invalid_client",
                  "error_description" : "Client authentication failed."
                }
              }
            }
          },
          "405" : {
            "description" : "Method not allowed. The token endpoint only accepts POST (RFC 6749 3.2)."
          },
          "415" : {
            "description" : "Unsupported media type. The body must be `application/x-www-form-urlencoded`.\n",
            "content" : {
              "application/json" : {
                "schema" : {
                  "$ref" : "#/components/schemas/OauthTokenErrorResponse"
                },
                "example" : {
                  "error" : "invalid_request",
                  "error_description" : "Content-Type must be application/x-www-form-urlencoded."
                }
              }
            }
          },
          "429" : {
            "description" : "Too many requests.",
            "headers" : {
              "Retry-After" : {
                "style" : "simple",
                "explode" : false,
                "schema" : {
                  "type" : "string"
                }
              }
            },
            "content" : {
              "application/json" : {
                "schema" : {
                  "$ref" : "#/components/schemas/OauthTokenErrorResponse"
                },
                "example" : {
                  "error" : "slow_down"
                }
              }
            }
          },
          "500" : {
            "description" : "Server error.",
            "content" : {
              "application/json" : {
                "schema" : {
                  "$ref" : "#/components/schemas/OauthTokenErrorResponse"
                },
                "example" : {
                  "error" : "server_error"
                }
              }
            }
          }
        }
      }
    },
